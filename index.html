<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDACAE - Sovereign Quantum Control Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col" x-data="hdacaeApp()">

    <!-- Header / Sovereign Command Bar -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
                HDACAE <span class="text-xs text-slate-400 font-normal">Sovereign Quantum Control Center</span>
            </h1>
        </div>
        
        <!-- Language Selector & Auth Actions -->
        <div class="flex items-center space-x-4">
            <!-- Language Dropdown -->
            <select x-model="currentLang" class="bg-slate-800 text-xs text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg focus:outline-none focus:border-cyan-500">
                <option value="gu">ગુજરાતી (Gujarati)</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="en">English</option>
            </select>

            <span class="bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-xs text-slate-400">Node: HDACAE-AHM-01</span>
            
            <!-- Sign In / Sign Up Button -->
            <button @click="showAuthModal = true" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition shadow" x-text="t('authBtn')">
                Sign In / Sign Up
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation (11 Tabs) -->
        <aside class="w-72 bg-slate-900/90 border-r border-slate-800 flex flex-col p-4 space-y-1 overflow-y-auto">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-3 mb-2" x-text="t('navTitle')"></p>
            
            <template x-for="(tabName, tabKey) in tabsList()">
                <button @click="activeTab = tabKey"
                        :class="activeTab === tabKey ? 'bg-cyan-600 text-white shadow-md shadow-cyan-900/50' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
                        class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition flex items-center space-x-3">
                    <span x-text="tabName"></span>
                </button>
            </template>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-slate-950 p-8 overflow-y-auto">
            
            <!-- Tab 1: Sovereign Dashboard -->
            <div x-show="activeTab === 'dashboard'" class="space-y-6">
                
                <!-- Visitor Value Proposition Banner (Fully Translated) -->
                <div class="bg-gradient-to-r from-slate-900 via-slate-900 to-indigo-950 border border-cyan-500/30 p-6 rounded-2xl shadow-xl space-y-4">
                    <div class="flex items-center space-x-2">
                        <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-xs px-3 py-1 rounded-full font-mono" x-text="t('visionBadge')"></span>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-indigo-300" x-text="t('visionTitle')"></h2>
                    <p class="text-slate-300 text-sm leading-relaxed" x-text="t('visionDesc')"></p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                        <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl">
                            <h4 class="text-xs font-bold text-cyan-400" x-text="t('feat1Title')"></h4>
                            <p class="text-xs text-slate-400 mt-1" x-text="t('feat1Desc')"></p>
                        </div>
                        <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl">
                            <h4 class="text-xs font-bold text-emerald-400" x-text="t('feat2Title')"></h4>
                            <p class="text-xs text-slate-400 mt-1" x-text="t('feat2Desc')"></p>
                        </div>
                        <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl">
                            <h4 class="text-xs font-bold text-indigo-400" x-text="t('feat3Title')"></h4>
                            <p class="text-xs text-slate-400 mt-1" x-text="t('feat3Desc')"></p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow">
                        <h3 class="text-xs text-slate-400 uppercase font-semibold" x-text="t('card1Title')"></h3>
                        <p class="text-2xl font-bold text-emerald-400 mt-2" x-text="t('card1Val')"></p>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow">
                        <h3 class="text-xs text-slate-400 uppercase font-semibold" x-text="t('card2Title')"></h3>
                        <p class="text-2xl font-bold text-cyan-400 mt-2" x-text="t('card2Val')"></p>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow">
                        <h3 class="text-xs text-slate-400 uppercase font-semibold" x-text="t('card3Title')"></h3>
                        <p class="text-2xl font-bold text-indigo-400 mt-2" x-text="t('card3Val')"></p>
                    </div>
                </div>

                <!-- Sovereign Prompt Interface -->
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl mt-6 space-y-4">
                    <h3 class="text-sm font-semibold text-cyan-300" x-text="t('assistantTitle')"></h3>
                    <div class="flex gap-3">
                        <input type="text" x-model="userPrompt" :placeholder="t('promptPlaceholder')" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                        <button @click="callAI()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition shadow" x-text="t('executeBtn')"></button>
                    </div>
                    <div x-show="aiResponse" class="bg-slate-950 border border-slate-800 p-4 rounded-lg mt-4 text-sm text-slate-300 font-mono" x-text="aiResponse"></div>
                </div>
            </div>

            <!-- Other Tabs Content -->
            <div x-show="activeTab === 'quantum'" class="space-y-6">
                <h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().quantum"></h2>
                <p class="text-slate-400 text-sm">Manage sovereign decentralized nodes and computational clusters.</p>
            </div>
            <div x-show="activeTab === 'dimensions'" class="space-y-6">
                <h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().dimensions"></h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <template x-for="i in 18">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-lg">
                            <span class="text-xs text-cyan-500 font-mono" x-text="'Dimension ' + i"></span>
                            <h4 class="text-sm font-semibold text-slate-200 mt-1" x-text="getDimensionName(i)"></h4>
                        </div>
                    </template>
                </div>
            </div>
            <div x-show="activeTab === 'orchestrator'"><h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().orchestrator"></h2></div>
            <div x-show="activeTab === 'intervention'"><h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().intervention"></h2></div>
            <div x-show="activeTab === 'contentHub'"><h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().contentHub"></h2></div>
            <div x-show="activeTab === 'governance'"><h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().governance"></h2></div>
            <div x-show="activeTab === 'publicHealth'"><h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().publicHealth"></h2></div>
            <div x-show="activeTab === 'repository'"><h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().repository"></h2></div>
            <div x-show="activeTab === 'vault'"><h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().vault"></h2></div>
            <div x-show="activeTab === 'terminal'"><h2 class="text-2xl font-bold text-cyan-400" x-text="tabsList().terminal"></h2></div>

        </main>
    </div>

    <!-- Sign In / Sign Up Modal -->
    <div x-show="showAuthModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-6 relative">
            <button @click="showAuthModal = false" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
            
            <div class="text-center space-y-2">
                <h3 class="text-xl font-bold text-cyan-400" x-text="t('modalTitle')"></h3>
                <p class="text-xs text-slate-400" x-text="t('modalSub')"></p>
            </div>

            <!-- Google Login Button -->
            <button @click="gmailLogin()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3 rounded-xl flex items-center justify-center space-x-3 transition shadow">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.15C3.16 21.39 7.23 24 12 24z"/>

                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.16 2.61 1.2 6.6l4.08 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/>
                </svg>
                <span x-text="t('googleBtn')"></span>
            </button>

            <div class="flex items-center my-4">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="px-3 text-xs text-slate-500 uppercase" x-text="t('orText')"></span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- Email & Password Form -->
            <div class="space-y-4">
                <input type="email" :placeholder="t('emailPlaceholder')" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                <input type="password" :placeholder="t('passPlaceholder')" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                <button @click="alert(t('authSuccess'))" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-3 rounded-xl font-medium transition shadow" x-text="t('authBtnText')"></button>
            </div>
        </div>
    </div>
